name: CI
on:
  schedule:
    # https://crontab.guru/#20_3_*_*_2,5
    - cron: "20 3 * * 2,5"
  push:
    branches-ignore:
      - "gh-pages"
      - "preview-*"
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "Django pull request number (leave empty for wasm/django-ref)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('repo-pr-{0}', github.event.pull_request.number) || inputs.pr && format('django-pr-{0}', inputs.pr) || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      django_head: ${{ steps.pr.outputs.head }}
      django_base: ${{ steps.pr.outputs.base }}
    steps:
      - name: Resolve the Django PR revision
        if: inputs.pr != ''
        id: pr
        env:
          DJANGO_PR: ${{ inputs.pr }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$DJANGO_PR" =~ ^[1-9][0-9]{0,19}$ ]]
          gh api "repos/django/django/pulls/$DJANGO_PR" --jq '"head=\(.head.sha)\nbase=\(.base.sha)"' >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Match the CPython version in Pyodide 0.29.3.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: wasm/requirements.txt
      - name: Install the selected Django revision
        env:
          DJANGO_HEAD: ${{ steps.pr.outputs.head }}
        run: |
          ref=$(cat wasm/django-ref)
          if [[ ! "$ref" =~ ^[a-zA-Z0-9._/-]+$ ]]; then
            echo "wasm/django-ref must contain a Django Git branch, tag, or commit."
            exit 1
          fi
          ref=${DJANGO_HEAD:-$ref}
          python -m pip install -r wasm/requirements.txt "Django @ git+https://github.com/django/django.git@$ref"
      - uses: actions/cache@v4
        with:
          path: wasm/.cache
          key: pyodide-${{ hashFiles('wasm/build.py') }}
      - name: Test the WSGI bridge and deployment routing
        run: python -m unittest discover -s wasm -p 'test_*.py'
      - name: Build the browser demo
        run: python wasm/build.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: wasm/dist/django_admin_tests
      - uses: actions/upload-artifact@v5
        with:
          name: webassembly-demo
          path: wasm/dist
          include-hidden-files: true
          retention-days: 7

  review:
    needs: build
    if: inputs.pr != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions: {}
    env:
      DJANGO_HEAD: ${{ needs.build.outputs.django_head }}
      DJANGO_BASE: ${{ needs.build.outputs.django_base }}
      DJANGO_PR: ${{ inputs.pr }}
    steps:
      - name: Fetch Django history for the review
        run: |
          git init django
          git -C django remote add origin https://github.com/django/django.git
          git -C django fetch --filter=blob:none origin "$DJANGO_BASE" "$DJANGO_HEAD"
          git -C django checkout --detach "$DJANGO_BASE"
      - run: npm install --global @alibaba-group/open-code-review@1.13.10
      - name: Review the Django diff
        env:
          OCR_LLM_URL: ${{ secrets.OCR_LLM_URL }}
          OCR_LLM_TOKEN: ${{ secrets.OCR_LLM_AUTH_TOKEN }}
          OCR_LLM_MODEL: ${{ vars.OCR_LLM_MODEL || 'MiniMax-M3' }}
          OCR_USE_ANTHROPIC: 'false'
        run: |
          ocr config set language English
          ocr config set llm.extra_body '{"reasoning_effort":"max"}'
          ocr llm test
          echo "OpenCodeReview for django/django PR #$DJANGO_PR ($DJANGO_HEAD)" > review.txt
          ocr review --repo django --from "$DJANGO_BASE" --to "$DJANGO_HEAD" \
            --audience agent --format text --background "Review Django PR #$DJANGO_PR for correctness and regressions." >> review.txt
      - uses: actions/upload-artifact@v5
        with:
          name: django-review
          path: review.txt

  publish-branch:
    needs: [build, review]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      github.event_name != 'pull_request' &&
      startsWith(github.ref, 'refs/heads/') &&
      github.ref != 'refs/heads/gh-pages' &&
      !startsWith(github.ref, 'refs/heads/preview-')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Select the Pages branch and URL
        id: target
        env:
          SOURCE_BRANCH: ${{ github.ref_name }}
          DJANGO_PR: ${{ inputs.pr }}
        run: python3 wasm/deployment.py
      - uses: actions/download-artifact@v5
        with:
          name: webassembly-demo
          path: wasm/dist
      - uses: actions/download-artifact@v5
        if: needs.review.result == 'success'
        with:
          name: django-review
          path: wasm/dist
      - name: Record unavailable review
        if: inputs.pr != '' && needs.review.result != 'success'
        run: echo 'The automated review was unavailable. See the review job in GitHub Actions.' > wasm/dist/review.txt
      - uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: ${{ steps.target.outputs.branch }}
          folder: wasm/dist
          clean: true

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      inputs.pr == ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
