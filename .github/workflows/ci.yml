name: CI
on:
  schedule:
    # https://crontab.guru/#20_3_*_*_2,5
    - cron: "20 3 * * 2,5"
  push:
    branches-ignore:
      - "gh-pages"
      - "preview-*"
  pull_request:
  workflow_dispatch:
    inputs:
      pr:
        description: "Django pull request number (leave empty for main)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: wasm-${{ github.workflow }}-${{ github.ref }}-${{ inputs.pr || 'main' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          # Match the CPython version in Pyodide 0.29.3.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: wasm/requirements.txt
      - name: Install the selected Django revision
        env:
          DJANGO_PR: ${{ inputs.pr }}
        run: |
          ref=main
          if [ -n "$DJANGO_PR" ]; then
            if [[ ! "$DJANGO_PR" =~ ^[1-9][0-9]*$ ]]; then
              echo "The Django PR number must be a positive integer."
              exit 1
            fi
            ref="refs/pull/$DJANGO_PR/head"
          fi
          python -m pip install -r wasm/requirements.txt "Django @ git+https://github.com/django/django.git@$ref"
      - uses: actions/cache@v4
        with:
          path: wasm/.cache
          key: pyodide-${{ hashFiles('wasm/build.py') }}
      - name: Test the WSGI bridge
        run: python -m unittest discover -s wasm -p 'test_*.py'
      - name: Build the browser demo
        run: python wasm/build.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser smoke test dependencies
        run: |
          npm ci --prefix wasm
          npx --prefix wasm playwright install --with-deps chromium
      - name: Test the browser demo
        run: npm test --prefix wasm
      - uses: actions/upload-artifact@v5
        if: failure()
        with:
          name: browser-test-results
          path: wasm/test-results
          retention-days: 7
      - uses: actions/upload-pages-artifact@v4
        with:
          path: wasm/dist/django_admin_tests
      - uses: actions/upload-artifact@v5
        with:
          name: webassembly-demo
          path: wasm/dist
          include-hidden-files: true
          retention-days: 7

  publish-branch:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v5
        with:
          name: webassembly-demo
          path: wasm/dist
      - uses: JamesIves/github-pages-deploy-action@v4.7.4
        with:
          branch: ${{ inputs.pr && format('preview-{0}', inputs.pr) || 'gh-pages' }}
          folder: wasm/dist
          clean: true

  deploy:
    needs: build
    if: >-
      github.ref == 'refs/heads/main' &&
      github.event_name != 'pull_request' &&
      inputs.pr == ''
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
